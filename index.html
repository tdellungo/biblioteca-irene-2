<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Biblioteca Irene 2.0</title>
    <link rel="stylesheet" href="src/css/stile.css">
</head>

<body>

    <header>
        <h1>Biblioteca Irene 2.0</h1>
        <p>Catalogo digitale della biblioteca scolastica</p>
    </header>

    <main>

        <section class="ricerca">
            <h2>Ricerca nel catalogo</h2>
            <input type="text" placeholder="Cerca un libro...">
            <button>Cerca</button>
        </section>

        <section class="catalogo">
            <h2>Libri presenti</h2>

            <div class="libro">
                <h3>La storia. Progettare il futuro</h3>
                <p>Autori: Barbero, Frugoni, Sclarandis</p>
                <p>Materia: Storia</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Biblioteca Irene 2.0 - Liceo Artistico G.C. Argan</p>
    </footer>

    <script src="src/js/app.js"></script>

</body>

</html>
